// ===== STORAGE =====
async function saveH(n,d){try{localStorage.setItem('hosp:'+n,JSON.stringify(d));return true;}catch(e){console.error('Save error:',e);return false;}}
async function loadH(n){try{const r=localStorage.getItem('hosp:'+n);return r?JSON.parse(r):null;}catch(e){return null;}}
async function delH(n){try{localStorage.removeItem('hosp:'+n);}catch(e){}}
async function listH(){try{const keys=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('hosp:'))keys.push(k.replace('hosp:',''));}return keys;}catch(e){return[];}}
// Shared tag data (stored once, used by all hospitals)
function saveTag(tagData){try{localStorage.setItem('shared_tag',JSON.stringify(tagData));return true;}catch(e){return false;}}
function loadTag(){try{const r=localStorage.getItem('shared_tag');return r?JSON.parse(r):null;}catch(e){return null;}}
function hasTag(){return!!localStorage.getItem('shared_tag');}

  const cnChars=/[脸额头双体点丽龙风鸟鱼黄齿龄医国学车门开关图书应选边还运过连达适际电预题类发复继续线网义习联览观试认调讲负资质轻转农递钱钢长录闲难飞验区华结竞稳称种积确监当异产环营准残归岁标换损据担历强张带导层属备压报则写对从个动后态缩吸]/;

// Determine if an event is surgical(S) or non-surgical(N)
function getOpType(evName){
  // 1) Use findTagKw to get matched tag keyword
  const kw=findTagKw(evName);
  if(kw){
    // 2) Reverse lookup: which CATMAP group has this tag as its top tag?
    for(const[group,topTag]of Object.entries(CATMAP.gt)){
      if(topTag===kw&&OPMAP.g[group])return OPMAP.g[group];
    }
    // 3) Check if tag keyword itself is a group name
    if(OPMAP.g[kw])return OPMAP.g[kw];
    // 4) Check if tag keyword contains a group name or vice versa
    for(const[group,op]of Object.entries(OPMAP.g)){
      if(kw.includes(group)||group.includes(kw))return op;
    }
    // 5) Check category level
    for(const[cat,topTag]of Object.entries(CATMAP.ct)){
      if(topTag===kw&&OPMAP.c[cat])return OPMAP.c[cat];
    }
  }

  const clean=evName.replace(/AI분석진단/gi,"").replace(/히트\s*/g,"").replace(/추가금\s*없는\s*/g,"").replace(/더나\s*/g,"").replace(/DERNA\s*/g,"").toLowerCase();

  const nonsurgical=["리프팅","lifting","보톡스","botox","필러","filler","레이저","laser","토닝","toning","주사","injection","부스터","booster","스킨","skin","제모","필링","peeling","관리","care","수액","쥬베룩","리쥬란","포텐자","인모드","슈링크","울쎄라","써마지","온다","올리지오","oligio","ulthera","hifu","potenza","rejuran","thermage","thread","실리프팅","고주파","dissolving","contouring","non-surgical"];
  let sScore=0,nScore=0;
  for(const w of surgical){if(clean.includes(w))sScore++;}
  for(const w of nonsurgical){if(clean.includes(w))nScore++;}
  if(sScore>0&&nScore===0)return"S";
  if(nScore>0&&sScore===0)return"N";
  if(nScore>sScore)return"N";
  if(sScore>nScore)return"S";
  return"?";
}

function findTagKw(evName){
  if(!D||!D.tag)return"";
  const clean=evName.replace(/AI분석진단/gi,"").replace(/히트\s*/g,"").replace(/추가금\s*없는\s*/g,"").replace(/더나\s*/g,"").replace(/DERNA\s*/g,"").trim();
  const tagKeys=Object.keys(D.tag);let best="",bL=0;
  // ① Direct longest substring
  for(const kw of tagKeys){if(kw.length>=2&&clean.includes(kw)&&kw.length>bL){best=kw;bL=kw.length;}}
  if(best)return best;
  // ② Space-removed
  const cNS=clean.replace(/\s+/g,"");
  for(const kw of tagKeys){if(kw.length>=2&&cNS.includes(kw.replace(/\s+/g,""))&&kw.length>bL){best=kw;bL=kw.length;}}
  if(best)return best;
  // ③ Word = tag keyword
  const words=clean.replace(/[,/_·x]/g," ").split(/\s+/).filter(p=>p.length>=2);
  for(const w of words){if(tagKeys.includes(w))return w;}
  // ④ Group name match (min 3 chars overlap)
  let bestGL=0;best="";
  for(const w of words){for(const[g,t]of Object.entries(CATMAP.gt)){
    if(g.length<3)continue;
    if(g.includes(w)&&w.length>=3&&w.length>bestGL){best=t;bestGL=w.length;}
    if(w.includes(g)&&g.length>bestGL){best=t;bestGL=g.length;}}}
  if(best&&bestGL>=3)return best;
  // ⑤ Category name match
  best="";bL=0;
  for(const w of words){for(const[c,t]of Object.entries(CATMAP.ct)){
    if(c.includes(w)&&w.length>=3&&w.length>bL){best=t;bL=w.length;}
    if(w.includes(c)&&c.length>=2&&c.length>bL){best=t;bL=c.length;}}}
  if(best)return best;
  // ⑥ Multi-word scoring: tag with most event-word matches
  let bestScore=0;best="";
  for(const kw of tagKeys){let score=0;for(const w of words){if(w.length>=2&&kw.includes(w))score+=w.length;}
    if(score>bestScore){bestScore=score;best=kw;}}
  if(best&&bestScore>=3)return best;
  // ⑦ Substring decomposition: try 3+ char substrings, prefer shortest (most specific) tag
  for(const w of words){if(w.length<4)continue;
    for(let len=w.length;len>=3;len--){for(let i=0;i<=w.length-len;i++){
      const sub=w.slice(i,i+len);let bTag="",bTL=9999;
      for(const kw of tagKeys){if(kw.includes(sub)&&kw.length<bTL){bTag=kw;bTL=kw.length;}}
      if(bTag)return bTag;}}}
  // ⑧ Manual fallback for keywords not in tag/category data
  const FB={"염증":"여드름주사","여드름":"여드름압출","모공":"아쿠아필링","탄력":"콜라겐주사","수분":"물광주사","재생":"PRP피부재생술","미백":"레이저토닝","기미":"레이저토닝","색소":"레이저토닝","턱끝":"턱끝보톡스","이중턱":"이중턱지방흡입","팔자":"팔자주름필러","귀족":"귀족수술(보형물)","다이어트":"다이어트한약","체형":"윤곽주사","동안":"콜라겐주사","안티에이징":"콜라겐주사","볼처짐":"안면거상술","처짐":"실리프팅","스킨케어":"아쿠아필링","피부관리":"아쿠아필링","흉터":"흉터제거레이저","켈로이드":"캘로이드주사","제모":"겨드랑이제모","문신":"문신제거","반영구":"문신제거","치아":"치아미백","hair":"머리모발이식","acne":"여드름압출","pore":"아쿠아필링","whitening":"레이저토닝","aging":"콜라겐주사","diet":"다이어트한약","scar":"흉터제거레이저"};
  for(const w of words){for(const[k,v]of Object.entries(FB)){if(w.includes(k)||k.includes(w)){if(D.tag[v])return v;}}}
  return"";
}
function mkSVG(kw){
  try{if(!D||!D.tag)return"";const tr=D.tag[kw];if(!tr)return"";

  const ks=Object.keys(tr).sort().filter(k=>k<=S.lm).slice(-4);if(ks.length<2)return"";
  const lastDataMonth=D.months[D.months.length-1];
  const vs=ks.map(k=>{let v=tr[k];if(S.proj&&k===lastDataMonth&&isP(k,S.mktE))v=prj(v,S.mktE,k);return v;});
  const g=vs[vs.length-2]>0?(vs[vs.length-1]-vs[vs.length-2])/vs[vs.length-2]*100:0;
  const mx=Math.max(...vs),mn=Math.min(...vs),r=mx-mn||1,col=g>=0?"#059669":"#dc2626";
  const pts=vs.map((v,i)=>(i/(vs.length-1))*40+","+(14-((v-mn)/r)*12)).join(" ");

}

          const ev=String(row['이벤트 제목']||'').trim();if(!ev||ev==='총계'||!curMo)return;

        tagMap={};tJ.forEach(row=>{const kw=String(row['분석 단위']||'').trim();if(!kw)return;const td={};

      res({hospital:S.hn||"병원",months:mos,events:evts,cpc:cpcE,tag:tagMap});

function makeTopComment(ev,allEvs){
  const d=ev.cur.d,v=ev.cur.v,r=ev.cur.r,dG=ev.dG;
  const cvr=(r*100).toFixed(1);
  const avgD=allEvs.reduce((s,e)=>s+e.cur.d,0)/allEvs.length;
  const avgR=allEvs.reduce((s,e)=>s+e.cur.r,0)/allEvs.length;
  const parts=[];

  // DB 절대량
  if(d>=avgD*2) parts.push(`전체 평균 대비 ${(d/avgD).toFixed(1)}배 높은 DB ${d.toLocaleString()}건을 기록하며 최상위 성과를 유지하고 있습니다.`);
  else parts.push(`DB ${d.toLocaleString()}건으로 상위권 성과를 안정적으로 유지하고 있습니다.`);

  // 전환율
  if(r>avgR*1.3) parts.push(`전환율 ${cvr}%로 평균보다 높아 콘텐츠-수요 매칭이 우수합니다.`);
  else if(r<avgR*0.7) parts.push(`전환율 ${cvr}%는 개선 여지가 있어 썸네일·가격 강조 등 콘텐츠 보완을 권장합니다.`);

  // 성장률
  if(dG!==null){
    if(dG>=20) parts.push(`전월 대비 +${dG.toFixed(1)}% 성장하며 상승 모멘텀이 뚜렷합니다.`);
    else if(dG>=5) parts.push(`전월 대비 +${dG.toFixed(1)}% 소폭 성장 중입니다.`);
    else if(dG<=-20) parts.push(`전월 대비 ${dG.toFixed(1)}% 감소 추세이므로 이벤트 구성 점검이 필요합니다.`);
    else if(dG<0) parts.push(`전월 대비 ${dG.toFixed(1)}% 소폭 감소했으나 절대 DB량은 견조합니다.`);
    else parts.push(`전월 대비 DB가 안정적으로 유지되고 있습니다.`);
  }

  return parts.slice(0,2).join(" ");
}

function makeBotComment(ev,allEvs){
  const d=ev.cur.d,v=ev.cur.v,r=ev.cur.r,dG=ev.dG;
  const cvr=(r*100).toFixed(1);
  const avgR=allEvs.reduce((s,e)=>s+e.cur.r,0)/allEvs.length;
  const parts=[];

  // 조회수 vs DB 불균형 분석
  if(v>500&&d<=2){
    parts.push(`조회수 ${v.toLocaleString()}회에 비해 DB ${d}건으로 전환율이 매우 낮습니다. 가격·혜택 정보를 전면에 강조하거나 Before/After 콘텐츠를 보강해 전환 유도를 높여야 합니다.`);
  } else if(d===0){
    parts.push(`최신월 DB가 0건입니다. 이벤트 노출 여부 및 랜딩 페이지 상태를 우선 점검하고, 시즌 연관성이 낮다면 일시 중단 후 재기획을 고려하세요.`);
  } else {
    parts.push(`DB ${d.toLocaleString()}건으로 하위권에 해당합니다.`);
    if(r<avgR*0.5) parts.push(`전환율 ${cvr}%가 평균의 절반 이하로, 이벤트 제목·썸네일·혜택 구성 전면 개편이 필요합니다.`);
    else if(v<200) parts.push(`조회수 자체가 ${v.toLocaleString()}회로 낮아 노출 카테고리 및 키워드 재검토가 필요합니다.`);
    else parts.push(`이벤트 내용 차별화 또는 가격 경쟁력 검토가 권장됩니다.`);
  }

  // 성장 추세
  if(dG!==null&&dG<=-30) parts.push(`전월 대비 ${dG.toFixed(1)}% 급감하여 즉각적인 대응이 필요합니다.`);
  else if(dG!==null&&dG>=10) parts.push(`다만 전월 대비 +${dG.toFixed(1)}% 개선 중이므로 현 방향을 유지하며 콘텐츠를 강화하면 효과적입니다.`);

  return parts.slice(0,2).join(" ");
}

      <button onclick="document.getElementById('pdfModal').remove()" style="padding:10px 16px;border-radius:10px;border:1px solid #e5e7eb;background:#fff;color:#6b7280;font-size:13px;cursor:pointer;font-family:'Noto Sans KR'">취소</button>
    </div>

function doPDFExport(){
  const mode=document.getElementById('pdfMode').value;
  document.getElementById('pdfModal').remove();
  if(mode==='summary') return doSummaryPDF();
  const checks=document.querySelectorAll('input[name=fullTab]:checked');
  const tabs=[...checks].map(c=>c.value);if(!tabs.length)return;
  const origTab=S.tab;const origExp=new Set(S.exp);
  let printHTML=`<div style="font-family:'Noto Sans KR',sans-serif;max-width:1100px;margin:0 auto;padding:20px">`;
  printHTML+=`<div style="margin-bottom:20px"><div style="font-size:10px;color:#6366f1;font-weight:700;letter-spacing:2px">PERFORMANCE REPORT</div><h1 style="font-size:24px;font-weight:900">${esc(D.hospital)}</h1><div style="font-size:11px;color:#9ca3af">${fM(S.ms[0])} ~ ${fM(S.lm)} · ${new Date().toLocaleDateString('ko-KR')}</div></div>`;
  let idx=0;
  function processTab(){
    if(idx>=tabs.length){
      printHTML+=`</div>`;
      S.tab=origTab;S.exp=origExp;R();
      openPrintWindow(printHTML);
      return;
    }
    const tab=tabs[idx];
    S.tab=tab;S.exp=new Set();rDash();
    // Give charts time to render
    setTimeout(()=>{
      try{rCh();}catch(e){}
      setTimeout(()=>{
        // Convert canvases to images
        document.querySelectorAll('#app canvas').forEach(cv=>{
          try{const img=document.createElement('img');img.src=cv.toDataURL('image/png');img.style.cssText='width:100%;max-height:220px;object-fit:contain';cv.parentNode.replaceChild(img,cv);}catch(e){}
        });
        const content=document.getElementById('app').innerHTML;
        const doc=(new DOMParser()).parseFromString(content,'text/html');
        doc.querySelectorAll('.bbtn,.ctrl,.tabs,.cf,button,.footer,.tg').forEach(el=>el.remove());
        const hdr=doc.querySelector('.hdr');if(hdr)hdr.remove();
        printHTML+=`<div style="page-break-before:${idx>0?'always':'auto'};margin-bottom:20px">`;
        printHTML+=`<h2 style="font-size:16px;font-weight:800;margin-bottom:12px;padding-bottom:6px;border-bottom:2px solid #6366f1">${{overview:'종합 대시보드',events:'이벤트별 성과',cpc:'CPC 검색광고',mom:'MOM 변화'}[tab]}</h2>`;
        printHTML+=doc.body.innerHTML;printHTML+=`</div>`;
        idx++;processTab();
      },200);
    },100);
  }
  processTab();
}
function doSummaryPDF(){
  const checks=document.querySelectorAll('input[name=sumEv]:checked');
  const selIdxs=[...checks].map(c=>+c.value);
  const evsByDB=[...D.events].map(e=>({...e,cur:evT(e,S.lm),prev:evT(e,S.ms[S.P])})).filter(e=>e.cur.d>0).sort((a,b)=>b.cur.d-a.cur.d);
  const selEvs=selIdxs.map(i=>evsByDB[i]).filter(Boolean);
  const ms=S.ms,lm=S.lm,co=S.co;
  const cur=mTot(lm,co),prev=mTot(ms[S.P],co);
  const gD=prev.d?(cur.d-prev.d)/prev.d*100:0;
  const gCPA=prev.cpa?(cur.cpa-prev.cpa)/prev.cpa*100:0;
  // MOM months
  const momMs=ms.filter(m=>m<=lm).slice(-S.momMonths);
  const momTots=momMs.map(m=>mTot(m,co));
  const cpcTots=momMs.map(m=>cpcMT(m,co));
  let h=`<div style="font-family:'Noto Sans KR',sans-serif;max-width:800px;margin:0 auto;padding:30px">`;
  // Header
  h+=`<div style="text-align:center;margin-bottom:24px;padding-bottom:16px;border-bottom:2px solid #6366f1">
  <div style="font-size:10px;color:#6366f1;font-weight:700;letter-spacing:3px;margin-bottom:4px">MONTHLY PERFORMANCE REPORT</div>
  <h1 style="font-size:28px;font-weight:900;margin-bottom:4px">${esc(D.hospital)}</h1>
  <div style="font-size:12px;color:#9ca3af">${fM(lm)} 성과 요약 · ${new Date().toLocaleDateString('ko-KR')}</div></div>`;
  // KPI Cards
  h+=`<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px">
  <div style="background:#f9fafb;border-radius:10px;padding:12px;text-align:center"><div style="font-size:9px;color:#6b7280;margin-bottom:2px">${fM(lm)} 조회수</div><div style="font-size:18px;font-weight:800;font-family:'JetBrains Mono'">${fN(cur.v)}</div></div>
  <div style="background:#f9fafb;border-radius:10px;padding:12px;text-align:center"><div style="font-size:9px;color:#6b7280;margin-bottom:2px">총 DB</div><div style="font-size:18px;font-weight:800;font-family:'JetBrains Mono'">${fN(cur.d)}</div><div style="font-size:9px;margin-top:2px">${bg(gD)}</div></div>
  <div style="background:#f9fafb;border-radius:10px;padding:12px;text-align:center"><div style="font-size:9px;color:#6b7280;margin-bottom:2px">전환율</div><div style="font-size:18px;font-weight:800;font-family:'JetBrains Mono'">${fP(cur.r)}</div></div>
  <div style="background:#f9fafb;border-radius:10px;padding:12px;text-align:center"><div style="font-size:9px;color:#6b7280;margin-bottom:2px">DB당 투자비용</div><div style="font-size:18px;font-weight:800;font-family:'JetBrains Mono';color:#0891b2">₩${fN(cur.cpa)}</div><div style="font-size:9px;margin-top:2px">${bgInv(gCPA)}</div></div>
  <div style="background:#f9fafb;border-radius:10px;padding:12px;text-align:center"><div style="font-size:9px;color:#6b7280;margin-bottom:2px">총 광고비</div><div style="font-size:18px;font-weight:800;font-family:'JetBrains Mono'">₩${fN(cur.c)}</div></div></div>`;
  // Selected Main Events
  if(selEvs.length){
    h+=`<div style="font-size:14px;font-weight:800;margin-bottom:10px">📌 주요 이벤트</div>`;
    selEvs.forEach(ev=>{
      const dG=ev.prev.d?(ev.cur.d-ev.prev.d)/ev.prev.d*100:0;
      h+=`<div style="background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:14px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div style="font-size:13px;font-weight:700"><span style="font-size:8px;padding:1px 5px;border-radius:3px;background:#eef2ff;color:#6366f1;margin-right:4px">${ev.l}</span>${esc(ev.n.slice(0,40))}</div>
        <div style="font-size:16px;font-weight:800;color:#0891b2;font-family:'JetBrains Mono'">₩${fN(ev.cur.cpa)} <span style="font-size:9px;color:#9ca3af">DB당비용</span></div>
      </div>
      <table style="width:100%;border-collapse:collapse;font-size:11px">
      <thead><tr style="border-bottom:1px solid #e5e7eb"><th style="text-align:left;padding:4px 6px;font-size:9px;color:#9ca3af;font-weight:600">월</th><th style="text-align:center;padding:4px 6px;font-size:9px;color:#9ca3af">조회수</th><th style="text-align:center;padding:4px 6px;font-size:9px;color:#9ca3af">DB</th><th style="text-align:center;padding:4px 6px;font-size:9px;color:#9ca3af">전환율</th><th style="text-align:right;padding:4px 6px;font-size:9px;color:#9ca3af">비용</th></tr></thead><tbody>`;
      ms.slice(-4).forEach(m=>{const t=evT(ev,m);const isL=m===lm;
        h+=`<tr style="${isL?'background:#eef2ff;font-weight:700':''}"><td style="padding:5px 6px;font-family:'Noto Sans KR';font-weight:600">${fM(m)}</td><td style="text-align:center;padding:5px 6px;font-family:'JetBrains Mono'">${fN(t.v)}</td><td style="text-align:center;padding:5px 6px;font-family:'JetBrains Mono'">${fN(t.d)}</td><td style="text-align:center;padding:5px 6px;font-family:'JetBrains Mono'">${fP(t.r)}</td><td style="text-align:right;padding:5px 6px;font-family:'JetBrains Mono'">₩${fN(t.c)}</td></tr>`;});
      h+=`</tbody></table>
      <div style="margin-top:6px;font-size:10px;color:#6b7280">DB 성장 ${bg(dG)}</div></div>`;
    });
  }
  // MOM Summary
  h+=`<div style="font-size:14px;font-weight:800;margin:16px 0 10px">📊 MOM 종합 (최근 ${momMs.length}개월)</div>`;
  h+=`<table style="width:100%;border-collapse:collapse;font-size:11px"><thead><tr style="border-bottom:2px solid #6366f1"><th style="text-align:left;padding:6px;font-size:9px;color:#9ca3af">구분</th>`;
  momMs.forEach(m=>h+=`<th style="text-align:center;padding:6px;font-size:9px;color:#9ca3af">${fM(m)}</th>`);
  h+=`<th style="text-align:center;padding:6px;font-size:9px;color:#9ca3af">전월비</th></tr></thead><tbody>`;
  const mL=momMs.length-1,mP=momMs.length-2;
  [["조회수",momTots.map(t=>t.v),fN,0],["총 DB",momTots.map(t=>t.d),fN,0],["전환율",momTots.map(t=>t.r),fP,0],["총 광고비",momTots.map(t=>t.c),v=>"₩"+fN(v),0],["DB당 투자비용",momTots.map(t=>t.cpa),v=>"₩"+fN(v),1]].forEach(([lb,vals,fmt,inv])=>{
    h+=`<tr style="border-bottom:1px solid #f3f4f6"><td style="padding:6px;font-weight:600;font-family:'Noto Sans KR'">${lb}</td>`;
    vals.forEach((v,i)=>h+=`<td style="text-align:center;padding:6px;font-family:'JetBrains Mono'${i===mL?';background:#eef2ff;color:#4338ca;font-weight:700':''}">${fmt(v)}</td>`);
    const l=vals[mL],p=vals[mP];h+=`<td style="text-align:center;padding:6px">${p?(inv?bgInv:bg)((l-p)/p*100):""}</td></tr>`;});
  // CPC row if exists
  if(cpcTots.some(c=>c.cn>0)){
    h+=`<tr style="border-top:1px solid #e5e7eb"><td style="padding:6px;font-weight:600;color:#6b7280">CPC DB</td>`;
    cpcTots.forEach((c,i)=>h+=`<td style="text-align:center;padding:6px;font-family:'JetBrains Mono';color:#6366f1${i===mL?';background:#eef2ff;font-weight:700':''}">${fN(c.cn)}</td>`);
    const l=cpcTots[mL].cn,p=cpcTots[mP].cn;h+=`<td style="text-align:center;padding:6px">${p?bg((l-p)/p*100):""}</td></tr>`;
  }
  h+=`</tbody></table>`;
  // Footer
  h+=`<div style="margin-top:24px;padding-top:12px;border-top:1px solid #e5e7eb;text-align:center;font-size:9px;color:#9ca3af">
  DB = CPV전환 + CPC전환 · DB당 투자비용 = (CPV비용+CPC비용) ÷ 총DB · 강남언니 성과 리포트</div></div>`;
  openPrintWindow(h);
}

  .st2{font-size:14px;font-weight:700;margin:18px 0 6px}img{max-width:100%}

  </style></head><body>${html}
  <script>setTimeout(()=>window.print(),500);<\/script></body></html>`);

function showToast(msg,sub){

async function exportJSON(){
  if(!D)return;
  const jsonStr=JSON.stringify(D);
  const fileName=D.hospital+'_report.json';
  if(window.showSaveFilePicker){
    try{
      const handle=await window.showSaveFilePicker({suggestedName:fileName,types:[{description:'JSON',accept:{'application/json':['.json']}}]});
      const writable=await handle.createWritable();
      await writable.write(jsonStr);await writable.close();
      showToast('✓ 저장 완료','iCloud Drive를 사용하는 기기끼리 이 파일을 공유할 수 있습니다.');
      return;
    }catch(e){if(e.name==='AbortError')return;}
  }
  const blob=new Blob([jsonStr],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=fileName;a.click();URL.revokeObjectURL(a.href);
  showToast('📦 내보내기 완료','iCloud Drive를 사용하는 기기끼리 이 파일을 공유할 수 있습니다.<br><br>① 다운로드된 파일을 iCloud Drive에 저장<br>② 다른 기기 홈화면 → "📦 JSON 가져오기"');
}
function importJSON(inp){
  if(!inp.files[0])return;
  const fr=new FileReader();
  fr.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      if(!data.hospital||!data.months||!data.events){alert('유효하지 않은 리포트 파일입니다.');return;}
      D=data;S.hn=data.hospital;S.scr="dash";isDirty=true;
      saveH(data.hospital,data);
      R();
    }catch(err){alert('파일 파싱 오류: '+err);}
  };
  fr.readAsText(inp.files[0]);
}
